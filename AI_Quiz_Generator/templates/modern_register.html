<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - QuizAI Pro</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/professional-style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Background Animation -->
    <div class="bg-animation">
        <div class="floating-shapes">
            <div class="shape shape-1"></div>
            <div class="shape shape-2"></div>
            <div class="shape shape-3"></div>
            <div class="shape shape-4"></div>
        </div>
    </div>

    <!-- Navigation -->
    <header class="navbar">
        <div class="logo">
            <h2><i class="fas fa-brain"></i> QuizAI Pro</h2>
        </div>
        <div class="nav-links">
            <a href="/"><i class="fas fa-home"></i> Home</a>
            <a href="/login"><i class="fas fa-sign-in-alt"></i> Login</a>
        </div>
    </header>

    <!-- Registration Container -->
    <div class="center-page">
        <div class="form-box register-form">
            <div class="form-header">
                <h2><i class="fas fa-user-plus"></i> Create Account</h2>
                <p>Join the future of interactive learning</p>
            </div>

            <!-- Role Selection -->
            <div class="role-selector" style="display: flex; gap: 1rem; margin-bottom: 2rem;">
                <div class="role-card" data-role="student" style="flex: 1; padding: 1.5rem; border: 2px solid var(--glass-border); border-radius: 15px; text-align: center; cursor: pointer; transition: var(--transition); background: var(--glass-bg); backdrop-filter: blur(5px);">
                    <i class="fas fa-graduation-cap" style="font-size: 2rem; margin-bottom: 0.5rem; color: #667eea;"></i>
                    <h4>Student</h4>
                    <p style="font-size: 0.9rem; color: var(--text-secondary);">Attend quizzes and track progress</p>
                </div>
                <div class="role-card" data-role="teacher" style="flex: 1; padding: 1.5rem; border: 2px solid var(--glass-border); border-radius: 15px; text-align: center; cursor: pointer; transition: var(--transition); background: var(--glass-bg); backdrop-filter: blur(5px);">
                    <i class="fas fa-chalkboard-teacher" style="font-size: 2rem; margin-bottom: 0.5rem; color: #f093fb;"></i>
                    <h4>Teacher</h4>
                    <p style="font-size: 0.9rem; color: var(--text-secondary);">Create quizzes and monitor students</p>
                </div>
                <div class="role-card" data-role="admin" style="flex: 1; padding: 1.5rem; border: 2px solid var(--glass-border); border-radius: 15px; text-align: center; cursor: pointer; transition: var(--transition); background: var(--glass-bg); backdrop-filter: blur(5px);">
                    <i class="fas fa-user-shield" style="font-size: 2rem; margin-bottom: 0.5rem; color: #4facfe;"></i>
                    <h4>Admin</h4>
                    <p style="font-size: 0.9rem; color: var(--text-secondary);">Manage institution platform</p>
                </div>
            </div>

            <!-- Registration Form -->
            <form method="POST" id="registrationForm">
                <input type="hidden" name="role" id="selectedRole" required>

                <!-- Common Fields -->
                <div class="form-row" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label for="name"><i class="fas fa-user"></i> Full Name</label>
                        <input type="text" id="name" name="name" placeholder="Enter your full name" required>
                    </div>
                    <div class="form-group">
                        <label for="email"><i class="fas fa-envelope"></i> Email Address</label>
                        <input type="email" id="email" name="email" placeholder="your.email@example.com" required>
                    </div>
                </div>

                <div class="form-row" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label for="mobile"><i class="fas fa-phone"></i> Mobile Number</label>
                        <input type="tel" id="mobile" name="mobile" placeholder="+91 98765 43210" pattern="[0-9]{10}" required>
                    </div>
                    <div class="form-group">
                        <label for="password"><i class="fas fa-lock"></i> Password</label>
                        <input type="password" id="password" name="password" placeholder="Create a strong password" required>
                        <div class="password-strength" style="margin-top: 0.5rem; height: 4px; background: var(--glass-border); border-radius: 2px; overflow: hidden;">
                            <div id="strengthBar" style="height: 100%; width: 0%; transition: var(--transition);"></div>
                        </div>
                    </div>
                </div>

                <!-- Role-specific Fields -->
                <div id="studentFields" style="display: none;">
                    <div class="form-row" style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem;">
                        <div class="form-group">
                            <label for="registerNumber"><i class="fas fa-id-card"></i> Register Number</label>
                            <input type="text" id="registerNumber" name="registerNumber" placeholder="e.g., 2021CS001">
                        </div>
                        <div class="form-group">
                            <label for="department"><i class="fas fa-building"></i> Department</label>
                            <select id="department" name="department">
                                <option value="">Select Department</option>
                                <option value="Computer Science">Computer Science</option>
                                <option value="Information Technology">Information Technology</option>
                                <option value="Electronics">Electronics</option>
                                <option value="Mechanical">Mechanical</option>
                                <option value="Civil">Civil</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="semester"><i class="fas fa-book"></i> Semester</label>
                            <select id="semester" name="semester">
                                <option value="">Select Semester</option>
                                <option value="1">1st Semester</option>
                                <option value="2">2nd Semester</option>
                                <option value="3">3rd Semester</option>
                                <option value="4">4th Semester</option>
                                <option value="5">5th Semester</option>
                                <option value="6">6th Semester</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div id="teacherFields" style="display: none;">
                    <div class="form-row" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                        <div class="form-group">
                            <label for="employeeId"><i class="fas fa-briefcase"></i> Employee ID</label>
                            <input type="text" id="employeeId" name="employeeId" placeholder="e.g., T001">
                        </div>
                        <div class="form-group">
                            <label for="teacherDepartment"><i class="fas fa-chalkboard"></i> Department</label>
                            <select id="teacherDepartment" name="teacherDepartment">
                                <option value="">Select Department</option>
                                <option value="Computer Science">Computer Science</option>
                                <option value="Information Technology">Information Technology</option>
                                <option value="Electronics">Electronics</option>
                                <option value="Mechanical">Mechanical</option>
                                <option value="Civil">Civil</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="subjects"><i class="fas fa-book-open"></i> Subjects (comma-separated)</label>
                        <input type="text" id="subjects" name="subjects" placeholder="e.g., Data Structures, Algorithms, Database">
                    </div>
                </div>

                <div id="adminFields" style="display: none;">
                    <div class="form-group">
                        <label for="institution"><i class="fas fa-university"></i> Institution Name</label>
                        <input type="text" id="institution" name="institution" placeholder="Your College/University Name">
                    </div>
                    <div class="form-group">
                        <label for="adminLevel"><i class="fas fa-user-cog"></i> Admin Level</label>
                        <select id="adminLevel" name="adminLevel">
                            <option value="">Select Level</option>
                            <option value="college">College Level</option>
                            <option value="department">Department Level</option>
                        </select>
                    </div>
                </div>

                <!-- Terms and Conditions -->
                <div class="form-group" style="margin-bottom: 2rem;">
                    <label style="display: flex; align-items: center; cursor: pointer;">
                        <input type="checkbox" id="terms" name="terms" required style="margin-right: 0.5rem;">
                        <span style="color: var(--text-secondary); font-size: 0.9rem;">
                            I agree to the <a href="#" style="color: #667eea;">Terms of Service</a> and <a href="#" style="color: #667eea;">Privacy Policy</a>
                        </span>
                    </label>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn" style="background: var(--primary-gradient);">
                    <i class="fas fa-user-plus"></i> Create Account
                </button>

                <!-- Login Link -->
                <div style="text-align: center; margin-top: 2rem; color: var(--text-secondary);">
                    <p>Already have an account? <a href="/login" style="color: #667eea; text-decoration: none;">Sign In</a></p>
                </div>
            </form>
        </div>
    </div>

    <style>
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .floating-shapes {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .shape {
            position: absolute;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1), rgba(240, 147, 251, 0.1));
            border-radius: 50%;
            animation: float-shape 20s infinite ease-in-out;
        }

        .shape-1 {
            width: 100px;
            height: 100px;
            top: 10%;
            left: 10%;
            animation-delay: 0s;
        }

        .shape-2 {
            width: 150px;
            height: 150px;
            top: 70%;
            right: 10%;
            animation-delay: 5s;
        }

        .shape-3 {
            width: 80px;
            height: 80px;
            bottom: 20%;
            left: 30%;
            animation-delay: 10s;
        }

        .shape-4 {
            width: 120px;
            height: 120px;
            top: 30%;
            right: 30%;
            animation-delay: 15s;
        }

        @keyframes float-shape {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(30px, -30px) rotate(90deg); }
            50% { transform: translate(-20px, 20px) rotate(180deg); }
            75% { transform: translate(-30px, -20px) rotate(270deg); }
        }

        .role-card.selected {
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.2);
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }

        .role-card:hover {
            border-color: #667eea;
            transform: translateY(-3px);
        }

        .form-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .form-header h2 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .form-header p {
            color: var(--text-secondary);
        }

        @media (max-width: 768px) {
            .role-selector {
                flex-direction: column;
            }
            
            .form-row {
                grid-template-columns: 1fr !important;
            }
        }
    </style>

    <script>
        // Role Selection
        const roleCards = document.querySelectorAll('.role-card');
        const selectedRoleInput = document.getElementById('selectedRole');
        const studentFields = document.getElementById('studentFields');
        const teacherFields = document.getElementById('teacherFields');
        const adminFields = document.getElementById('adminFields');

        roleCards.forEach(card => {
            card.addEventListener('click', function() {
                // Remove selected class from all cards
                roleCards.forEach(c => c.classList.remove('selected'));
                
                // Add selected class to clicked card
                this.classList.add('selected');
                
                // Set the role value
                const role = this.getAttribute('data-role');
                selectedRoleInput.value = role;
                
                // Show/hide role-specific fields
                studentFields.style.display = role === 'student' ? 'block' : 'none';
                teacherFields.style.display = role === 'teacher' ? 'block' : 'none';
                adminFields.style.display = role === 'admin' ? 'block' : 'none';
                
                // Update required fields based on role
                updateRequiredFields(role);
            });
        });

        function updateRequiredFields(role) {
            // Remove all required attributes first
            document.querySelectorAll('[data-role-required]').forEach(field => {
                field.removeAttribute('required');
            });
            
            // Add required attributes based on role
            if (role === 'student') {
                document.getElementById('registerNumber').setAttribute('data-role-required', 'true');
                document.getElementById('registerNumber').required = true;
                document.getElementById('department').required = true;
                document.getElementById('semester').required = true;
            } else if (role === 'teacher') {
                document.getElementById('employeeId').setAttribute('data-role-required', 'true');
                document.getElementById('employeeId').required = true;
                document.getElementById('teacherDepartment').required = true;
                document.getElementById('subjects').required = true;
            } else if (role === 'admin') {
                document.getElementById('institution').setAttribute('data-role-required', 'true');
                document.getElementById('institution').required = true;
                document.getElementById('adminLevel').required = true;
            }
        }

        // Password Strength Checker
        const passwordInput = document.getElementById('password');
        const strengthBar = document.getElementById('strengthBar');

        passwordInput.addEventListener('input', function() {
            const password = this.value;
            let strength = 0;
            
            if (password.length >= 8) strength++;
            if (password.match(/[a-z]/) && password.match(/[A-Z]/)) strength++;
            if (password.match(/[0-9]/)) strength++;
            if (password.match(/[^a-zA-Z0-9]/)) strength++;
            
            const strengthPercentage = (strength / 4) * 100;
            strengthBar.style.width = strengthPercentage + '%';
            
            if (strength <= 1) {
                strengthBar.style.background = 'linear-gradient(135deg, #f5576c, #f093fb)';
            } else if (strength <= 2) {
                strengthBar.style.background = 'linear-gradient(135deg, #fa709a, #fee140)';
            } else if (strength <= 3) {
                strengthBar.style.background = 'linear-gradient(135deg, #30cfd0, #330867)';
            } else {
                strengthBar.style.background = 'linear-gradient(135deg, #4facfe, #00f2fe)';
            }
        });

        // Form Validation and Submission
        document.getElementById('registrationForm').addEventListener('submit', function(e) {
            e.preventDefault(); // Prevent default form submission
            
            const role = selectedRoleInput.value;
            
            if (!role) {
                showNotification('Please select your role (Student, Teacher, or Admin)', 'error');
                return;
            }
            
            // Validate mobile number
            const mobile = document.getElementById('mobile').value;
            if (!/^[0-9]{10}$/.test(mobile)) {
                showNotification('Please enter a valid 10-digit mobile number', 'error');
                return;
            }
            
            // Show loading state
            const submitBtn = this.querySelector('button[type="submit"]');
            const originalText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating Account...';
            submitBtn.disabled = true;
            
            // Create FormData
            const formData = new FormData(this);
            
            // Send AJAX request
            fetch('/register', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showNotification(data.message || 'Registration successful!', 'success');
                    setTimeout(() => {
                        window.location.href = data.redirect || '/login';
                    }, 2000);
                } else {
                    showNotification(data.message || 'Registration failed', 'error');
                    submitBtn.innerHTML = originalText;
                    submitBtn.disabled = false;
                }
            })
            .catch(error => {
                console.error('Registration error:', error);
                showNotification('An error occurred during registration', 'error');
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
            });
        });

        // Mobile number formatting
        document.getElementById('mobile').addEventListener('input', function(e) {
            this.value = this.value.replace(/[^0-9]/g, '').slice(0, 10);
        });

        // Notification System
        function showNotification(message, type = 'info') {
            const notification = document.createElement('div');
            notification.className = `alert alert-${type}`;
            notification.innerHTML = `
                <i class="fas fa-${type === 'error' ? 'exclamation-circle' : type === 'success' ? 'check-circle' : 'info-circle'}"></i>
                ${message}
            `;
            notification.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                z-index: 9999;
                min-width: 300px;
                animation: slideIn 0.3s ease-out;
            `;
            
            document.body.appendChild(notification);
            
            // Auto remove after 5 seconds
            setTimeout(() => {
                if (notification.parentNode) {
                    notification.parentNode.removeChild(notification);
                }
            }, 5000);
        }
    </script>
</body>
</html>
