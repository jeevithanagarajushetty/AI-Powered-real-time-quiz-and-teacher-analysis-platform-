<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create AI Quiz - QuizAI Platform</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/modern-style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .create-quiz-container {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 2rem;
        }
        
        .quiz-header {
            text-align: center;
            margin-bottom: 3rem;
            color: white;
        }
        
        .quiz-header h1 {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 1rem;
            text-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        
        .quiz-header p {
            font-size: 1.2rem;
            opacity: 0.9;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .quiz-form {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            padding: 3rem;
        }
        
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-bottom: 2rem;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
        }
        
        .form-group label {
            color: white;
            font-weight: 600;
            margin-bottom: 0.8rem;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .form-group input,
        .form-group select,
        .form-group textarea {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 15px;
            padding: 1rem;
            color: white;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #4facfe;
            box-shadow: 0 0 20px rgba(79, 172, 254, 0.4);
            background: rgba(255, 255, 255, 0.15);
        }
        
        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }
        
        .file-upload {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
            border: 2px dashed rgba(255, 255, 255, 0.3);
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .file-upload:hover {
            border-color: #4facfe;
            background: rgba(255, 255, 255, 0.1);
        }
        
        .file-upload input[type="file"] {
            position: absolute;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
        
        .file-upload-label {
            font-size: 1.2rem;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }
        
        .file-upload i {
            font-size: 3rem;
            color: #4facfe;
        }
        
        .divider {
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            margin: 2rem 0;
            position: relative;
        }
        
        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: rgba(255, 255, 255, 0.3);
        }
        
        .divider span {
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 0 1rem;
            position: relative;
            z-index: 1;
        }
        
        .btn-generate {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 1.2rem 3rem;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: block;
            margin: 3rem auto 0;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        .btn-generate::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s;
        }
        
        .btn-generate:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(79, 172, 254, 0.5);
        }
        
        .btn-generate:hover::before {
            left: 100%;
        }
        
        .btn-generate:active {
            transform: translateY(-1px);
        }
        
        .loading {
            display: none;
            text-align: center;
            color: white;
            margin-top: 2rem;
        }
        
        .loading i {
            font-size: 2rem;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .quiz-preview {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 2rem;
            margin-top: 2rem;
            display: none;
        }
        
        .quiz-preview h3 {
            color: white;
            margin-bottom: 1rem;
        }
        
        .quiz-preview .quiz-code {
            font-size: 2rem;
            color: #4facfe;
            font-weight: 700;
            text-align: center;
            margin: 1rem 0;
        }
        
        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
            
            .quiz-form {
                padding: 2rem;
                margin: 0 1rem;
            }
            
            .quiz-header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="create-quiz-container">
        <!-- Navigation -->
        <nav class="navbar">
            <div class="nav-brand">
                <i class="fas fa-brain"></i>
                <span>QuizAI Platform</span>
            </div>
            <div class="nav-menu">
                <a href="/teacher" class="nav-link">
                    <i class="fas fa-chalkboard-teacher"></i>
                    Dashboard
                </a>
                <a href="/create_quiz" class="nav-link active">
                    <i class="fas fa-plus-circle"></i>
                    Create Quiz
                </a>
                <a href="/logout" class="nav-link">
                    <i class="fas fa-sign-out-alt"></i>
                    Logout
                </a>
            </div>
        </nav>

        <!-- Header -->
        <div class="quiz-header">
            <h1><i class="fas fa-magic"></i> Create AI-Powered Quiz</h1>
            <p>Upload your teaching materials and let our AI generate engaging questions automatically</p>
        </div>

        <!-- Quiz Creation Form -->
        <form class="quiz-form" method="POST" action="/create_quiz" enctype="multipart/form-data" id="quizForm">
            <div class="form-grid">
                <!-- File Upload -->
                <div class="form-group">
                    <label for="file">
                        <i class="fas fa-file-upload"></i>
                        Upload Study Material
                    </label>
                    <div class="file-upload">
                        <input type="file" name="file" id="file" accept=".pdf,.docx,.pptx,.txt">
                        <label for="file" class="file-upload-label">
                            <i class="fas fa-cloud-upload-alt"></i>
                            <span>Click to upload or drag & drop</span>
                            <small>PDF, DOCX, PPTX, TXT (Max 16MB)</small>
                        </label>
                    </div>
                </div>

                <!-- Quiz Title -->
                <div class="form-group">
                    <label for="title">
                        <i class="fas fa-heading"></i>
                        Quiz Title
                    </label>
                    <input type="text" name="title" id="title" placeholder="Enter quiz title" required>
                </div>
            </div>

            <!-- Quiz Details -->
            <div class="form-grid">
                <!-- Subject -->
                <div class="form-group">
                    <label for="subject">
                        <i class="fas fa-book"></i>
                        Subject
                    </label>
                    <input type="text" name="subject" id="subject" placeholder="e.g., Computer Science, Mathematics" required>
                </div>

                <!-- Difficulty -->
                <div class="form-group">
                    <label for="difficulty">
                        <i class="fas fa-tachometer-alt"></i>
                        Difficulty Level
                    </label>
                    <select name="difficulty" id="difficulty" required>
                        <option value="easy">🟢 Easy</option>
                        <option value="medium" selected>🟡 Medium</option>
                        <option value="hard">🔴 Hard</option>
                    </select>
                </div>
            </div>

            <!-- Quiz Configuration -->
            <div class="form-grid">
                <!-- Number of Questions -->
                <div class="form-group">
                    <label for="num_questions">
                        <i class="fas fa-list-ol"></i>
                        Number of Questions
                    </label>
                    <select name="num_questions" id="num_questions" required>
                        <option value="5">5 Questions</option>
                        <option value="10" selected>10 Questions</option>
                        <option value="15">15 Questions</option>
                        <option value="20">20 Questions</option>
                        <option value="25">25 Questions</option>
                        <option value="30">30 Questions</option>
                    </select>
                </div>

                <!-- Duration -->
                <div class="form-group">
                    <label for="duration">
                        <i class="fas fa-clock"></i>
                        Duration (Minutes)
                    </label>
                    <input type="number" name="duration_minutes" id="duration" value="30" min="5" max="180" required>
                </div>
            </div>

            <!-- Marks per Question -->
            <div class="form-group">
                <label for="marks">
                    <i class="fas fa-star"></i>
                    Marks per Question
                </label>
                <input type="number" name="marks_per_question" id="marks" value="1" min="1" max="10" required>
            </div>

            <!-- Additional Options -->
            <div class="form-group">
                <label for="description">
                    <i class="fas fa-align-left"></i>
                    Description (Optional)
                </label>
                <textarea name="description" id="description" rows="3" placeholder="Add any additional instructions for students..."></textarea>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn-generate">
                <i class="fas fa-magic"></i>
                Generate Quiz with AI
            </button>
        </form>

        <!-- Loading State -->
        <div class="loading" id="loading">
            <i class="fas fa-spinner fa-spin"></i>
            <p>Generating your AI-powered quiz...</p>
        </div>

        <!-- Quiz Result -->
        <div class="quiz-preview" id="quizResult">
            <h3><i class="fas fa-check-circle" style="color: #43e97b;"></i> Quiz Generated Successfully!</h3>
            <div class="quiz-code" id="quizCode"></div>
            <p style="text-align: center; color: rgba(255,255,255,0.8); margin-top: 1rem;">
                Share this code with your students
            </p>
            <div style="text-align: center; margin-top: 2rem;">
                <a href="/teacher" class="btn-generate" style="background: linear-gradient(135deg, #43e97b, #38f9d7);">
                    <i class="fas fa-arrow-left"></i>
                    Back to Dashboard
                </a>
            </div>
        </div>
    </div>

    <script>
        // File upload handling
        const fileInput = document.getElementById('file');
        const fileUploadLabel = document.querySelector('.file-upload-label');
        
        fileInput.addEventListener('change', function(e) {
            const fileName = e.target.files[0]?.name || 'No file selected';
            const fileSize = e.target.files[0]?.size || 0;
            
            if (fileSize > 0) {
                const fileSizeMB = (fileSize / (1024 * 1024)).toFixed(2);
                fileUploadLabel.innerHTML = `
                    <i class="fas fa-file"></i>
                    <span>${fileName} (${fileSizeMB} MB)</span>
                    <small>Click to change file</small>
                `;
            } else {
                fileUploadLabel.innerHTML = `
                    <i class="fas fa-cloud-upload-alt"></i>
                    <span>Click to upload or drag & drop</span>
                    <small>PDF, DOCX, PPTX, TXT (Max 16MB)</small>
                `;
            }
        });

        // Form submission with loading state
        document.getElementById('quizForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const loading = document.getElementById('loading');
            const form = document.getElementById('quizForm');
            const result = document.getElementById('quizResult');
            
            // Show loading
            loading.style.display = 'block';
            result.style.display = 'none';
            
            // Create FormData
            const formData = new FormData(form);
            
            // Submit via AJAX
            fetch('/create_quiz', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                loading.style.display = 'none';
                
                if (data.success) {
                    // Show success result
                    document.getElementById('quizCode').textContent = data.quiz_code;
                    result.style.display = 'block';
                    
                    // Scroll to result
                    result.scrollIntoView({ behavior: 'smooth' });
                    
                    // Reset form
                    form.reset();
                    fileUploadLabel.innerHTML = `
                        <i class="fas fa-cloud-upload-alt"></i>
                        <span>Click to upload or drag & drop</span>
                        <small>PDF, DOCX, PPTX, TXT (Max 16MB)</small>
                    `;
                } else {
                    // Show error
                    alert(data.message || 'Quiz creation failed. Please try again.');
                }
            })
            .catch(error => {
                loading.style.display = 'none';
                alert('An error occurred. Please try again.');
                console.error('Error:', error);
            });
        });

        // Add some animations
        document.addEventListener('DOMContentLoaded', () => {
            // Animate form elements
            const formGroups = document.querySelectorAll('.form-group');
            formGroups.forEach((group, index) => {
                group.style.animation = `slideInUp 0.5s ease-out ${index * 0.1}s both`;
            });
        });

        // Add slide in animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes slideInUp {
                from {
                    opacity: 0;
                    transform: translateY(20px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
